# Minimal Securosys Custom Server configuration.
# For all options, see the template.yml.

spring:
  datasource:
    url: jdbc:mariadb://localhost:3306/customserver
    username: customserver
    password: replaceme

tsb:
  tsbRestApi: 'https://sbx-rest-api.cloudshsm.com'
  tsbAccessToken: '<JWT Token>'

custom-server:
  # Fireblocks services allowed to sign payloads sent by the Key Link Agent.
  signatureServices:
    signingService:
      serviceName: 'SIGNING_SERVICE'
      # Optional; defaults to true. Set to false to disable this Fireblocks service entry.
      enabled: true
      # Vault Service certificate(s), used for transaction signing requests.
      fireblocksSignatureCertificates:
        - 'file:./etc/payload_validation_cert.pem'
      fireblocksSignaturePublicKeys: []
    configurationManager:
      serviceName: 'CONFIGURATION_MANAGER'
      # Optional; defaults to true. Set to false to disable this Fireblocks service entry.
      enabled: true
      # Configuration Manager certificate(s), used for proof-of-ownership onboarding requests.
      fireblocksSignatureCertificates:
        - ''
      fireblocksSignaturePublicKeys: []
  fireblocksAgentConfiguration:
    # Choose a secret value. Must be non-empty.
    # Set the CUSTOMER_SERVER_AUTHORIZATION envvar in the Fireblocks Key Link Agent to the same value.
    apiAuthorization: 'my-secret-api-key-123'

swaggerUI.enabled: true
