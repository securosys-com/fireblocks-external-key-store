buildscript {
	// buildscript classpath deps don't go through dependencyResolutionManagement, so the
	// maven-dev virtual is declared here too (for the Jib Spring Boot extension below).
	repositories {
		maven {
			name = 'mavenDev'
			url = uri('https://securosys.jfrog.io/artifactory/maven-dev')
			credentials(PasswordCredentials)
		}
	}
	dependencies {
		classpath 'com.google.cloud.tools:jib-spring-boot-extension-gradle:0.1.0'
	}
}

plugins {
    id 'base'
    id 'java'
    alias(libs.plugins.spring.boot) apply false
    alias(libs.plugins.lombok) apply false
    alias(libs.plugins.test.sets) apply false
    id 'org.flywaydb.flyway' version '11.14.0' apply false   // not in the shared catalog (gap)
	id 'com.google.cloud.tools.jib' version '3.5.2' apply false   // not in the shared catalog (gap)
}

allprojects {
    version = VERSION
    group = 'com.securosys.fireblocks'

    apply plugin: 'project-report'

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    // Dependency versions come from the shared Securosys platform (com.securosys:securosys-bom,
    // imported per-subproject below), which nests spring-boot-dependencies — the
    // io.spring.dependency-management plugin and the hand-maintained dependencyManagement block
    // are gone. All deps here are BOM- or Spring-governed, so no constraints block is needed.

    tasks.register('dumpBuildProperties') {
        description 'bump build properties relevant for our build pipeline'
        group 'help'
        doFirst {
            def props = new Properties()
            props.put('version', project.version.toString())
            def outputFile = layout.buildDirectory.file('build.properties').get().asFile
            outputFile.parentFile.mkdirs()

            outputFile.withWriter {
                props.store(it, null)
            }
        }
    }

    tasks.withType(Test).tap {
        configureEach {
            reports {
                junitXml.mergeReruns = true
                junitXml.outputLocation.set(rootProject.layout.buildDirectory.dir('reports/test-results'))
            }
        }
    }
}

subprojects {
    // No per-project repositories — everything resolves through the single `maven-dev` virtual
    // declared in settings.gradle (FAIL_ON_PROJECT_REPOS forbids re-adding them here). maven-dev
    // aggregates central + splunk; the jce-maven repo is no longer needed here.

    pluginManager.withPlugin('java') {
        apply plugin: 'org.unbroken-dome.test-sets'


        tasks.withType(Jar).configureEach {
            manifest.attributes(
                    'Implementation-Title': project.name,
                    'Implementation-Version': project.version,
                    'Implementation-Vendor': 'Securosys SA'
            )
        }

        tasks.withType(Test).configureEach { Test task ->
            task.useJUnitPlatform()
            task.doFirst {
                // fetching the profile, the default is set so gradle tasks can be executed
                def activeProfile = System.getProperty("activeTestProfile") == null ? "test" : System.getProperty("activeTestProfile")

                // setting the profile
                systemProperty "spring.profiles.active",activeProfile
                systemProperty "jdk.sunec.disableNative", "false"
                environment "jdk.sunec.disableNative", "false"
                environment "SPRING_PROFILES_ACTIVE", activeProfile
                println "Running ${project} tests with profile: ${activeProfile}"
            }
            //finalizedBy rootProject.tasks.named('aggregateTestReports')

            reports {
                junitXml.required = true
                html.required = true
                junitXml.outputLocation.set(rootProject.layout.buildDirectory.dir("reports/tests/${project.name}/xml"))
                html.outputLocation.set(rootProject.layout.buildDirectory.dir("reports/tests/${project.name}/html"))
            }
        }
        dependencies {
            // Version alignment + CVE/override floor come from the shared Securosys platform
            // (nests spring-boot-dependencies). Imported into annotationProcessor too so
            // version-less processors resolve.
            implementation platform("com.securosys:securosys-bom:${securosysBomVersion}")
            annotationProcessor platform("com.securosys:securosys-bom:${securosysBomVersion}")

            testImplementation libs.junit.jupiter.api
            testImplementation libs.mockito.junit.jupiter
            testImplementation libs.assertj.core
            testRuntimeOnly libs.junit.jupiter.engine
            testRuntimeOnly libs.junit.platform.launcher
        }
    }
}
